<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>FC26 Scoreboard - Pro Version</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: transparent; font-family: 'Anton', sans-serif; overflow: hidden; }

        #overlayUI { display: flex; align-items: center; justify-content: center; height: 100vh; }

        .board { 
            position: relative;
            width: 800px;
            height: 300px;
            background: url('./bp.png') no-repeat center center;
            background-size: contain;
            display: flex;
            align-items: center;
            justify-content: center;
            /* Arka plandaki damalı deseni yok etmek için (geçici çözüm) */
            mix-blend-mode: multiply; 
        }

        .score-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            /* Sayıları kalkanın tam üzerine oturtmak için ayarlar */
            padding: 0 120px;
            margin-top: 10px;
        }

        .score { 
            font-size: 115px; 
            color: white;
            text-shadow: 2px 4px 10px rgba(0,0,0,0.9);
            width: 130px;
            text-align: center;
            line-height: 1;
        }

        .spacer { width: 160px; } /* Kalkanın üzerini tam boş bırakmak için */

        #adminUI { display: none; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #000; gap: 20px; }
        .btn { width: 300px; padding: 20px; font-size: 25px; cursor: pointer; border-radius: 10px; border: none; color: white; font-family: 'Anton'; }
        .btn-w { background: green; }
        .btn-l { background: red; }
    </style>
</head>
<body>

<div id="overlayUI">
    <div class="board">
        <div class="score-container">
            <span class="score" id="wins">0</span>
            <div class="spacer"></div>
            <span class="score" id="losses">0</span>
        </div>
    </div>
</div>

<div id="adminUI">
    <h1 style="color: gold;">FC26 CONTROL</h1>
    <button class="btn btn-w" onclick="up('wins', 1)">WINS +1</button>
    <button class="btn btn-l" onclick="up('losses', 1)">LOSS +1</button>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://adem-can-yirtici-default-rtdb.europe-west1.firebasedatabase.app/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    db.ref('fc26_stats').on('value', (s) => {
        const d = s.val() || { wins: 0, losses: 0 };
        document.getElementById('wins').innerText = d.wins;
        document.getElementById('losses').innerText = d.losses;
    });

    function up(f, v) { db.ref('fc26_stats/' + f).transaction(c => (c || 0) + v); }

    if (new URLSearchParams(window.location.search).get('mode') === 'admin') {
        document.getElementById('adminUI').style.display = 'flex';
        document.getElementById('overlayUI').style.display = 'none';
        document.body.style.background = "#000";
    }
</script>
</body>
</html>
