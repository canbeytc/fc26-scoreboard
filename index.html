<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>FC26 Scoreboard - Fix</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: transparent; 
            font-family: 'Anton', sans-serif; 
            overflow: hidden; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            position: relative;
            width: 1000px; /* Görsel genişliği */
            height: 450px; /* Görsel yüksekliği */
            background: url('bp.jpg') no-repeat center center;
            background-size: contain;
        }

        .score { 
            position: absolute;
            top: 48%; /* Dikey hizalama */
            transform: translateY(-50%);
            font-size: 130px; 
            color: #ffffff;
            text-shadow: 0 0 20px rgba(255, 174, 0, 0.7), 4px 4px 10px rgba(0,0,0,0.8);
            width: 180px;
            text-align: center;
        }

        /* SOL SKOR - Yerini buradan ayarla */
        #wins { 
            left: 105px; 
        }

        /* SAĞ SKOR - Yerini buradan ayarla */
        #losses { 
            right: 105px; 
        }

        #adminUI { display: none; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #0a0a0a; gap: 20px; }
        .btn { width: 300px; padding: 25px; font-size: 30px; cursor: pointer; border-radius: 15px; border: none; color: white; font-family: 'Anton'; }
        .btn-w { background: #d4af37; }
        .btn-l { background: #c0392b; }
    </style>
</head>
<body>

<div id="overlayUI">
    <div class="container">
        <span class="score" id="wins">0</span>
        <span class="score" id="losses">0</span>
    </div>
</div>

<div id="adminUI">
    <h1 style="color: gold;">FC26 ADMIN</h1>
    <button class="btn btn-w" onclick="update('wins', 1)">GALİBİYET +1</button>
    <button class="btn btn-l" onclick="update('losses', 1)">MAĞLUBİYET +1</button>
    <button onclick="res()" style="color: grey; background: none; border: none; margin-top: 20px; cursor: pointer;">Skorları Sıfırla</button>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://adem-can-yirtici-default-rtdb.europe-west1.firebasedatabase.app/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const DB_PATH = 'fc26_data'; 

    db.ref(DB_PATH).on('value', (s) => {
        const d = s.val() || { wins: 0, losses: 0 };
        document.getElementById('wins').innerText = d.wins;
        document.getElementById('losses').innerText = d.losses;
    });

    function update(field, val) {
        db.ref(DB_PATH + '/' + field).transaction(current => (current || 0) + val);
    }

    function res() {
        if(confirm('Sıfırlansın mı?')) db.ref(DB_PATH).set({ wins: 0, losses: 0 });
    }

    if (new URLSearchParams(window.location.search).get('mode') === 'admin') {
        document.getElementById('adminUI').style.display = 'flex';
        document.getElementById('overlayUI').style.display = 'none';
        document.body.style.background = "#0a0a0a";
    }
</script>
</body>
</html>
