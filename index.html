<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>FC26 TikTok Scoreboard</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: transparent; /* Yayın için şeffaf arka plan */
            font-family: 'Arial Black', sans-serif; /* Daha okunaklı, kalın bir font */
        }

        .scoreboard-container {
            position: relative;
            width: 1000px; /* Tasarım genişliği */
            height: 400px;
            margin: 20px auto;
        }

        .bg-image {
            width: 100%;
            display: block;
            /* Hafif gölge vererek yayında öne çıkmasını sağlarız */
            filter: drop-shadow(0px 0px 10px rgba(0,0,0,0.5));
        }

        .overlay-text {
            position: absolute;
            color: #FFFFFF;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,1);
        }

        /* Sol Takım İsmi/Kısaltması */
        #home-name {
            top: 45px;
            left: 110px;
            width: 220px;
            height: 100px;
            font-size: 32px;
        }

        /* Sağ Takım İsmi/Kısaltması */
        #away-name {
            top: 45px;
            right: 110px;
            width: 220px;
            height: 100px;
            font-size: 32px;
        }

        /* Skor Alanı (FC26 logosunun hemen altı veya üstü için) */
        #score {
            top: 155px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            font-size: 54px;
            color: #FFD700; /* Altın sarısı */
            font-weight: 900;
        }
    </style>
</head>
<body>

    <div class="scoreboard-container">
        <img src="skortb.png" class="bg-image">
        
        <div id="home-name" class="overlay-text">EV SAHİBİ</div>
        <div id="score" class="overlay-text">0 - 0</div>
        <div id="away-name" class="overlay-text">DEPLASMAN</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Firebase Ayarların (Realtime Database ekranındaki URL'yi kullanıyoruz)
        const firebaseConfig = {
            databaseURL: "https://adem-can-yirtici-default-rtdb.europe-west1.firebasedatabase.app"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Firebase'deki 'skorlar' veya 'skorlar_live' düğümünü dinle
        const scoreRef = ref(db, 'skorlar'); 
        onValue(scoreRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                document.getElementById('home-name').innerText = data.evSahibi || "EV";
                document.getElementById('away-name').innerText = data.deplasman || "DEP";
                document.getElementById('score').innerText = `${data.evSkor} - ${data.depSkor}`;
            }
        });
    </script>
</body>
</html>
