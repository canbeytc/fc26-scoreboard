<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>FC26 Scoreboard - Pro Fix</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: transparent; font-family: 'Anton', sans-serif; overflow: hidden; }

        #overlayUI { display: flex; align-items: center; justify-content: center; height: 100vh; }

        .board { 
            position: relative;
            width: 800px;
            height: 300px;
            background: url('./bp.png') no-repeat center center;
            background-size: contain;
            display: flex;
            align-items: center;
            justify-content: center;
            /* ÖNEMLİ: Eğer resmin arkası kareliyse OBS'de 'Chroma Key' filtresi ekleyip 
               o gri/beyaz rengi seçersen şeffaflaşır. */
        }

        .score-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 0 120px;
            margin-top: 10px;
        }

        .score { 
            font-size: 115px; 
            color: white;
            text-shadow: 4px 4px 15px rgba(0,0,0,1);
            width: 130px;
            text-align: center;
            line-height: 1;
        }

        .spacer { width: 160px; }

        /* ADMIN PANELİ TASARIMI */
        #adminUI { 
            display: none; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            background: #111; 
            gap: 20px; 
        }
        .btn { 
            width: 350px; 
            padding: 30px; 
            font-size: 35px; 
            cursor: pointer; 
            border-radius: 20px; 
            border: none; 
            color: white; 
            font-family: 'Anton';
            text-transform: uppercase;
            box-shadow: 0 8px 0 #000;
        }
        .btn-w { background: linear-gradient(#2ecc71, #27ae60); }
        .btn-l { background: linear-gradient(#e74c3c, #c0392b); }
        .btn:active { transform: translateY(4px); box-shadow: 0 4px 0 #000; }
    </style>
</head>
<body>

<div id="overlayUI">
    <div class="board">
        <div class="score-container">
            <span class="score" id="wins">0</span>
            <div class="spacer"></div>
            <span class="score" id="losses">0</span>
        </div>
    </div>
</div>

<div id="adminUI">
    <h1 style="color: gold; font-size: 40px; margin-bottom: 20px;">FC26 KUMANDA</h1>
    <button class="btn btn-w" onclick="update('wins', 1)">GALİBİYET +1</button>
    <button class="btn btn-l" onclick="update('losses', 1)">MAĞLUBİYET +1</button>
    <button onclick="res()" style="margin-top:40px; background:none; border:1px solid #444; color:#444; padding:10px; cursor:pointer;">Sıfırla</button>
</div>

<script>
    // FİRBASE AYARLARI
    const firebaseConfig = { databaseURL: "https://adem-can-yirtici-default-rtdb.europe-west1.firebasedatabase.app/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    // BURASI KRİTİK: Admin ve Tabela aynı klasöre bakmalı
    const DB_NAME = 'fc26_stats'; 

    // VERİLERİ ÇEK
    db.ref(DB_NAME).on('value', (s) => {
        const d = s.val() || { wins: 0, losses: 0 };
        document.getElementById('wins').innerText = d.wins;
        document.getElementById('losses').innerText = d.losses;
    });

    // VERİLERİ GÜNCELLE
    function update(field, val) {
        db.ref(DB_NAME + '/' + field).transaction(c => (c || 0) + val);
    }

    function res() {
        if(confirm('Sıfırlansın mı?')) db.ref(DB_NAME).set({ wins: 0, losses: 0 });
    }

    // MOD KONTROLÜ
    if (window.location.search.includes('mode=admin')) {
        document.getElementById('adminUI').style.display = 'flex';
        document.getElementById('overlayUI').style.display = 'none';
        document.body.style.background = "#111";
    }
</script>
</body>
</html>
