<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>FC26 Ultra Gold Scoreboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        /* TEMEL AYARLAR */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: transparent; font-family: 'Anton', sans-serif; overflow: hidden; color: white; }

        #overlayUI { display: flex; align-items: center; justify-content: center; height: 100vh; }

        /* ANA TABELA: Senin bg.png dosyanı buraya gömüyoruz */
        .board { 
            position: relative;
            width: 700px; /* Görselin genişliğine göre ayarla */
            height: 180px; /* Görselin yüksekliğine göre ayarla */
            background: url('bg.png') no-repeat center center;
            background-size: contain; /* Görseli kutuya sığdır */
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.8));
        }

        /* Skorları hizalamak için görünmez kutular */
        .score-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            height: 100%;
            padding: 0 90px; /* Sayıları tam kalkanın yanındaki boşluklara oturtmak için ayarla */
            margin-top: 15px; /* Sayıları kalkanın altına hizalamak için */
        }

        .panel { 
            width: 120px;
            text-align: center;
        }

        /* SKOR SAYILARI (Orijinal Font) */
        .score { 
            font-size: 90px; /* Çok büyük sayılar */
            line-height: 1;
            text-shadow: 4px 4px 10px rgba(0,0,0,0.9);
            color: #fff;
        }

        /* ADMIN PANELİ (Aynı Kalıyor) */
        #adminUI { display: none; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #0a0a0a; gap: 20px; padding: 20px; }
        .btn { width: 100%; max-width: 400px; padding: 25px; font-size: 28px; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; color: white; text-transform: uppercase; }
        .btn-w { background: #1e7020; }
        .btn-l { background: #7a1a1a; }
        .btn-s { background: #333; font-size: 16px; margin-top: 10px; }
    </style>
</head>
<body>

<div id="overlayUI">
    <div class="board">
        <div class="score-wrapper">
            <div class="panel">
                <span class="score" id="wScore">0</span>
            </div>
            <div style="width: 150px;"></div>
            <div class="panel">
                <span class="score" id="lScore">0</span>
            </div>
        </div>
    </div>
</div>

<div id="adminUI">
    <h1 style="color:#d4af37; margin-bottom:10px;">FC26 KUMANDA</h1>
    <button class="btn btn-w" onclick="update('wins', 1)">WINS +1</button>
    <button class="btn btn-l" onclick="update('losses', 1)">LOSS +1</button>
    <button class="btn btn-s" onclick="reset()">SIFIRLA</button>
</div>

<script>
    // FİRBASE AYARLARI
    const firebaseConfig = { databaseURL: "https://adem-can-yirtici-default-rtdb.europe-west1.firebasedatabase.app/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const DB_PATH = 'fc26_data'; 

    // MOD KONTROLÜ
    if (new URLSearchParams(window.location.search).get('mode') === 'admin') {
        document.getElementById('adminUI').style.display = 'flex';
        document.getElementById('overlayUI').style.display = 'none';
        document.body.style.background = "#0a0a0a";
    }

    // VERİ DİNLEME (TABELAYI GÜNCELLE)
    db.ref(DB_PATH).on('value', (s) => {
        const d = s.val() || { wins: 0, losses: 0 };
        document.getElementById('wScore').innerText = d.wins;
        document.getElementById('lScore').innerText = d.losses;
    });

    // VERİ YAZMA (BUTONLAR)
    function update(f, v) {
        db.ref(DB_PATH + '/' + f).transaction(c => Math.max(0, (c || 0) + v));
    }

    function reset() {
        if(confirm('Tüm skorlar sıfırlansın mı?')) db.ref(DB_PATH).set({ wins: 0, losses: 0 });
    }
</script>
</body>
</html>
