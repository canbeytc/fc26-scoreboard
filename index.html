<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>FC26 Live Scoreboard</title>
    <style>
        /* Sayfa ve Genel Ayarlar */
        body, html { 
            margin: 0; padding: 0; 
            background-color: transparent; 
            overflow: hidden; 
            font-family: 'Arial Black', sans-serif; 
        }

        /* Scoreboard Kapsayıcı */
        .container { 
            position: relative; 
            width: 1000px; 
            height: 400px; 
            margin: 0 auto; 
        }

        .bg-img { width: 100%; display: block; }

        /* SKOR ALANI - KUTULARA KİLİTLEME */
        #score-wrapper {
            position: absolute;
            top: 105px;    /* Yukarı-Aşağı Ayarı: Eğer hala yukarıdaysa bu sayıyı artır (110, 115 gibi) */
            left: 50%;
            transform: translateX(-50%);
            width: 535px;  /* Kutuların birbirine olan uzaklığı */
            display: flex;
            justify-content: space-between; /* Birini en sola, birini en sağa iter */
            pointer-events: none;
        }

        .score-num {
            width: 110px;  /* Kutunun kendi genişliği */
            height: 85px;  /* Kutunun kendi yüksekliği */
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 60px;
            color: #FFD700;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
            font-weight: 900;
            /* Debug için: border: 1px solid red; (Kutuyu görmek istersen bunu açabilirsin) */
        }

        /* Takım Etiketleri (WIN/LOSE) */
        .team-label {
            position: absolute;
            top: 78px;
            color: white;
            font-size: 16px;
            text-shadow: 2px 2px 4px #000;
        }
        #home-label { left: 415px; }
        #away-label { right: 415px; }

        /* ADMIN PANELİ */
        #admin-controls {
            display: none;
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 10, 10, 0.9);
            padding: 15px 30px;
            border-radius: 50px;
            gap: 15px;
            border: 2px solid #f1c40f;
            z-index: 1000;
        }

        button { padding: 12px 25px; cursor: pointer; font-weight: 900; border: none; border-radius: 25px; text-transform: uppercase; }
        .btn-win { background: #27ae60; color: white; }
        .btn-lose { background: #e74c3c; color: white; }
        .btn-reset { background: #34495e; color: white; font-size: 10px; }

        body.admin-mode #admin-controls { display: flex; }
    </style>
</head>
<body id="main-body">

    <div class="container">
        <img src="skortb.png" class="bg-img">
        
        <div id="home-label" class="team-label">WIN</div>
        <div id="away-label" class="team-label">LOSE</div>

        <div id="score-wrapper">
            <div id="home-score" class="score-num">0</div>
            <div id="away-score" class="score-num">0</div>
        </div>
    </div>

    <div id="admin-controls">
        <button class="btn-win" onclick="updateScore('evSkor', 1)">WIN +1</button>
        <button class="btn-lose" onclick="updateScore('depSkor', 1)">LOSE +1</button>
        <button class="btn-reset" onclick="resetScores()">SIFIRLA</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://adem-can-yirtici-default-rtdb.europe-west1.firebasedatabase.app" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const scoreRef = ref(db, 'skorlar');

        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('mode') === 'admin') { document.getElementById('main-body').classList.add('admin-mode'); }

        onValue(scoreRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                document.getElementById('home-score').innerText = data.evSkor || 0;
                document.getElementById('away-score').innerText = data.depSkor || 0;
            }
        });

        window.updateScore = (type, amount) => {
            const r = ref(db, `skorlar/${type}`);
            onValue(r, (s) => { set(r, (s.val() || 0) + amount); }, { onlyOnce: true });
        };

        window.resetScores = () => {
            if(confirm("Sıfırla?")) set(scoreRef, { evSahibi: "WIN", deplasman: "LOSE", evSkor: 0, depSkor: 0 });
        };
    </script>
</body>
</html>
