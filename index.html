<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>FC26 Live Scoreboard</title>
    <style>
        body { 
            margin: 0; 
            background-color: transparent; 
            overflow: hidden; 
            font-family: 'Arial Black', sans-serif; 
        }
        
        /* SKOR TABELASI ALANI */
        .container { 
            position: relative; 
            width: 1000px; 
            height: 400px; 
            margin: auto; 
            transition: transform 0.3s ease;
        }
        .bg-img { width: 100%; display: block; }
        
        /* RAKAMLARIN KUTUCUKLARA AYARI */
        #score-wrapper { 
            position: absolute;
            top: 100px;           /* Kutucukların dikey hizası */
            left: 50%; 
            transform: translateX(-50%); 
            width: 780px;         /* İki kutu arası toplam genişlik alanı */
            display: flex;
            justify-content: space-between; /* Rakamları iki uca (kutulara) yaslar */
            align-items: center;
            pointer-events: none;
        }

        .score-num {
            width: 150px;         /* Kutu genişliği */
            text-align: center;
            font-size: 65px;      /* Rakam büyüklüğü */
            color: #FFD700;       /* Altın Sarısı */
            text-shadow: 2px 2px 10px rgba(0,0,0,0.9);
            font-weight: 900;
        }

        /* Takım İsimleri (Görselin üstünde küçük durur) */
        .team-label {
            position: absolute;
            top: 75px;
            color: white;
            font-size: 18px;
            text-transform: uppercase;
            text-shadow: 2px 2px 4px #000;
            width: 150px;
            text-align: center;
        }
        #home-label { left: 110px; }
        #away-label { right: 110px; }

        /* MODERN ADMIN PANELİ */
        #admin-controls {
            display: none;
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 10, 10, 0.9);
            padding: 20px 40px;
            border-radius: 60px;
            gap: 20px;
            border: 2px solid #f1c40f;
            box-shadow: 0 0 30px rgba(0,0,0,0.9);
            backdrop-filter: blur(15px);
            z-index: 1000;
        }

        button {
            padding: 15px 35px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 900;
            border: none;
            border-radius: 30px;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        button:active { transform: scale(0.95); }
        .btn-win { background: linear-gradient(to bottom, #27ae60, #1e8449); color: white; border-bottom: 4px solid #145a32; }
        .btn-lose { background: linear-gradient(to bottom, #e74c3c, #c0392b); color: white; border-bottom: 4px solid #7b241c; }
        .btn-reset { background: #34495e; color: #ecf0f1; font-size: 12px; }

        /* Admin modundayken scoreboard'u biraz yukarı çek */
        body.admin-mode .container { transform: translateY(-30px); }
        body.admin-mode #admin-controls { display: flex; }
    </style>
</head>
<body id="main-body">

    <div class="container">
        <img src="skortb.png" class="bg-img">
        
        <div id="home-label" class="team-label">WIN</div>
        <div id="away-label" class="team-label">LOSE</div>

        <div id="score-wrapper">
            <div id="home-score" class="score-num">0</div>
            <div id="away-score" class="score-num">0</div>
        </div>
    </div>

    <div id="admin-controls">
        <button class="btn-win" onclick="updateScore('evSkor', 1)">WIN +1</button>
        <button class="btn-lose" onclick="updateScore('depSkor', 1)">LOSE +1</button>
        <button class="btn-reset" onclick="resetScores()">SIFIRLA</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://adem-can-yirtici-default-rtdb.europe-west1.firebasedatabase.app"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const scoreRef = ref(db, 'skorlar');

        // Modu kontrol et (Admin mi izleyici mi?)
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('mode') === 'admin') {
            document.getElementById('main-body').classList.add('admin-mode');
        }

        // Skorları Dinle ve Güncelle
        onValue(scoreRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                document.getElementById('home-score').innerText = data.evSkor || 0;
                document.getElementById('away-score').innerText = data.depSkor || 0;
            }
        });

        // Skor Arttırma Fonksiyonu
        window.updateScore = (type, amount) => {
            const specificRef = ref(db, `skorlar/${type}`);
            onValue(specificRef, (snapshot) => {
                const current = snapshot.val() || 0;
                set(specificRef, current + amount);
            }, { onlyOnce: true });
        };

        // Resetleme Fonksiyonu
        window.resetScores = () => {
            if(confirm("Skorları sıfırlamak istiyor musun?")) {
                set(scoreRef, { evSahibi: "WIN", deplasman: "LOSE", evSkor: 0, depSkor: 0 });
            }
        };
    </script>
</body>
</html>
