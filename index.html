<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>FC26 Scoreboard - Final Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: transparent; font-family: 'Anton', sans-serif; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { position: relative; width: 900px; height: 400px; background: url('bp.png') no-repeat center center; background-size: contain; }
        .score { position: absolute; top: 50%; transform: translateY(-50%); font-size: 130px; color: #ffffff; text-shadow: 0 0 20px rgba(255, 174, 0, 0.7), 4px 4px 10px rgba(0,0,0,0.8); width: 180px; text-align: center; }
        #wins { left: 105px; } #losses { right: 105px; }
        #adminUI { display: none; flex-direction: column; align-items: center; justify-content: center; height: 100vh; width: 100vw; background: #0a0a0a; gap: 20px; position: fixed; top: 0; left: 0; z-index: 999; }
        .btn { width: 320px; padding: 30px; font-size: 35px; cursor: pointer; border-radius: 20px; border: none; color: white; font-family: 'Anton'; box-shadow: 0 6px 0 #000; transition: 0.1s; text-transform: uppercase; }
        .btn-w { background: #2ecc71; } .btn-l { background: #e74c3c; }
        .btn:active { transform: translateY(4px); box-shadow: none; }
    </style>
</head>
<body>

<div id="overlayUI">
    <div class="container">
        <span class="score" id="wins">0</span>
        <span class="score" id="losses">0</span>
    </div>
</div>

<div id="adminUI">
    <h1 style="color: gold; font-size: 50px; margin-bottom: 20px;">FC26 KONTROL</h1>
    <button class="btn btn-w" onclick="update('wins', 1)">GALİBİYET +1</button>
    <button class="btn btn-l" onclick="update('losses', 1)">MAĞLUBİYET +1</button>
    <button onclick="res()" style="background: none; border: 1px solid #333; color: #444; padding: 10px; margin-top: 30px; cursor: pointer;">Sıfırla</button>
</div>

<script>
    // ÖNEMLİ: Linkin sonundaki / işaretinden emin ol
    const firebaseConfig = { databaseURL: "https://adem-can-yirtici-default-rtdb.europe-west1.firebasedatabase.app" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    // Veritabanında 'skorlar' klasörü altına yazar
    const scoreRef = db.ref('skorlar');

    // VERİ OKUMA
    scoreRef.on('value', (snapshot) => {
        const data = snapshot.val() || { wins: 0, losses: 0 };
        document.getElementById('wins').innerText = data.wins || 0;
        document.getElementById('losses').innerText = data.losses || 0;
    });

    // VERİ YAZMA
    function update(type, val) {
        scoreRef.child(type).transaction((current) => {
            return (current || 0) + val;
        });
    }

    function res() {
        if(confirm('Sıfırlansın mı?')) scoreRef.set({ wins: 0, losses: 0 });
    }

    if (window.location.search.includes('mode=admin')) {
        document.getElementById('adminUI').style.display = 'flex';
        document.getElementById('overlayUI').style.display = 'none';
        document.body.style.background = "#0a0a0a";
    }
</script>
</body>
</html>
