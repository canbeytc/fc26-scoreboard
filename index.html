<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>FC26 Live Scoreboard</title>
    <style>
        body, html { margin: 0; padding: 0; background-color: transparent; overflow: hidden; font-family: 'Arial Black', sans-serif; }

        .container { 
            position: relative; 
            width: 1000px; 
            height: 400px; 
            margin: 0 auto; 
        }

        .bg-img { width: 100%; display: block; }

        /* GENEL RAKAM STİLİ */
        .score-num {
            position: absolute;
            width: 155px;         
            height: 148px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 135px;      
            color: #FFD700;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
            font-weight: 900;
            pointer-events: none;
        }

        /* SOL RAKAM (WIN) AYARI */
        #home-score {
            top: 130px;   
            left: 127px;  
        }

        /* SAĞ RAKAM (LOSE) AYARI */
        #away-score {
            top: 130px;   
            right: 108px; 
        }

        /* ADMIN PANELİ */
        #admin-controls {
            display: none;
            position: fixed;
            bottom: 250px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 10, 10, 0.9);
            padding: 44px 68px;
            border-radius: 50px;
            gap: 15px;
            border: 2px solid #f1c40f;
            z-index: 1000;
        }
        button { padding: 12px 25px; cursor: pointer; font-weight: 900; border: none; border-radius: 25px; text-transform: uppercase; }
        .btn-win { background: #27ae60; color: white; }
        .btn-lose { background: #e74c3c; color: white; }
        .btn-reset { background: #34495e; color: white; font-size: 10px; }
        body.admin-mode #admin-controls { display: flex; }
    </style>
</head>
<body id="main-body">

    <div class="container">
        <img src="skortb.png" class="bg-img">
        
        <div id="home-score" class="score-num">0</div>
        <div id="away-score" class="score-num">0</div>
    </div>

    <div id="admin-controls">
        <button class="btn-win" onclick="updateScore('evSkor', 1)">WIN +1</button>
        <button class="btn-lose" onclick="updateScore('depSkor', 1)">LOSE +1</button>
        <button class="btn-reset" onclick="resetScores()">SIFIRLA</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://adem-can-yirtici-default-rtdb.europe-west1.firebasedatabase.app" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const scoreRef = ref(db, 'skorlar');

        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('mode') === 'admin') { document.getElementById('main-body').classList.add('admin-mode'); }

        onValue(scoreRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                document.getElementById('home-score').innerText = data.evSkor || 0;
                document.getElementById('away-score').innerText = data.depSkor || 0;
            }
        });

        window.updateScore = (type, amount) => {
            const r = ref(db, `skorlar/${type}`);
            onValue(r, (s) => { set(r, (s.val() || 0) + amount); }, { onlyOnce: true });
        };

        window.resetScores = () => {
            // Direkt sıfırlama
            set(scoreRef, { evSahibi: "WIN", deplasman: "LOSE", evSkor: 0, depSkor: 0 });
        };
    </script>
</body>
</html>
