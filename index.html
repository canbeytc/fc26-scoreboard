<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>FC26 Scoreboard - Photoshop Optimized</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background: transparent; 
            overflow: hidden; 
            width: 1528px; 
            height: 688px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }

        .scoreboard-container {
            position: relative;
            width: 1528px;
            height: 688px;
            background: url('bp.png') no-repeat center center;
            background-size: 1528px 688px;
        }

        .score { 
            position: absolute;
            font-size: 115px; 
            color: #ffffff;
            font-family: 'Orbitron', sans-serif;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.8), 4px 4px 12px rgba(0,0,0,1);
            width: 300px;
            text-align: center;
            font-weight: 700;
            top: 44.5%; /* Kutuların dikey merkez hizası */
            transform: translateY(-50%);
        }

        /* --- 1528x688 MİLİMETRİK HİZALAMA --- */
        
        #wins { 
            left: 172px;  /* Sol altın çerçevenin tam ortası */
        }

        #losses { 
            right: 172px; /* Sağ altın çerçevenin tam ortası */
        }

        /* -------------------------------------- */

        #adminUI { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #0a0a0c; z-index: 999; flex-direction: column; 
            align-items: center; justify-content: center; gap: 30px; 
        }
        .btn { width: 380px; padding: 30px; font-size: 32px; cursor: pointer; border-radius: 15px; border: none; color: white; font-family: 'Orbitron'; font-weight: bold; transition: 0.1s; }
        .btn-w { background: linear-gradient(135deg, #2ecc71, #27ae60); }
        .btn-l { background: linear-gradient(135deg, #e74c3c, #c0392b); }
        .btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

<div id="overlay">
    <div class="scoreboard-container">
        <span class="score" id="wins">0</span>
        <span class="score" id="losses">0</span>
    </div>
</div>

<div id="adminUI">
    <h1 style="color: gold; font-family: 'Orbitron'; font-size: 45px; margin-bottom: 20px;">FC26 ADMIN</h1>
    <button class="btn btn-w" onclick="update('wins', 1)">WIN +1</button>
    <button class="btn btn-l" onclick="update('losses', 1)">LOSS +1</button>
    <div onclick="res()" style="color: #444; cursor: pointer; margin-top: 40px; font-size: 14px;">[ RESET DATA ]</div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://adem-can-yirtici-default-rtdb.europe-west1.firebasedatabase.app" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const scoreRef = db.ref('skorlar');

    scoreRef.on('value', (s) => {
        const d = s.val() || { wins: 0, losses: 0 };
        document.getElementById('wins').innerText = d.wins || 0;
        document.getElementById('losses').innerText = d.losses || 0;
    });

    function update(t, v) { scoreRef.child(t).transaction(c => (c || 0) + v); }
    function res() { if(confirm('Sıfırlansın mı?')) scoreRef.set({ wins: 0, losses: 0 }); }

    if (window.location.search.includes('mode=admin')) {
        document.getElementById('adminUI').style.display = 'flex';
        document.getElementById('overlay').style.display = 'none';
    }
</script>
</body>
</html>
