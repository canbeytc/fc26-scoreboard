<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>FC26 Scoreboard - Pro Final</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: transparent; font-family: 'Anton', sans-serif; overflow: hidden; }

        #overlayUI { display: flex; align-items: center; justify-content: center; height: 100vh; }

        .board { 
            position: relative;
            width: 800px;
            height: 300px;
            /* Dosya adının tam olarak bp.png olduğunu varsayıyoruz */
            background: url('./bp.png?v=99') no-repeat center center;
            background-size: contain;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .score-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 0 120px;
            margin-top: 15px; /* Sayıları kalkanın içine milimetrik oturtur */
        }

        .score { 
            font-size: 115px; 
            color: white;
            text-shadow: 4px 4px 12px rgba(0,0,0,1);
            width: 130px;
            text-align: center;
            line-height: 1;
        }

        .spacer { width: 160px; }

        /* ADMIN PANELİ (Sadece mode=admin ile görünür) */
        #adminUI { 
            display: none; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            background: #0a0a0a; 
            gap: 20px; 
        }
        .btn { 
            width: 350px; padding: 25px; font-size: 30px; 
            cursor: pointer; border-radius: 15px; border: none; 
            color: white; font-family: 'Anton'; text-transform: uppercase;
        }
        .btn-w { background: linear-gradient(#2ecc71, #27ae60); }
        .btn-l { background: linear-gradient(#e74c3c, #c0392b); }
        .btn:active { transform: scale(0.98); }
    </style>
</head>
<body>

<div id="overlayUI">
    <div class="board">
        <div class="score-container">
            <span class="score" id="wins">0</span>
            <div class="spacer"></div>
            <span class="score" id="losses">0</span>
        </div>
    </div>
</div>

<div id="adminUI">
    <h1 style="color: gold; margin-bottom: 20px;">FC26 SCORE CONTROL</h1>
    <button class="btn btn-w" onclick="send('wins', 1)">GALİBİYET +1</button>
    <button class="btn btn-l" onclick="send('losses', 1)">MAĞLUBİYET +1</button>
    <button onclick="reset()" style="margin-top:30px; background:none; border:1px solid #333; color:#444; cursor:pointer; padding:5px;">Sıfırla</button>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://adem-can-yirtici-default-rtdb.europe-west1.firebasedatabase.app/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    // Veritabanı yolu (Hem admin hem tabela burayı kullanacak)
    const REF_PATH = 'fc26_stats_live'; 

    // CANLI VERİ OKUMA
    db.ref(REF_PATH).on('value', (s) => {
        const d = s.val() || { wins: 0, losses: 0 };
        document.getElementById('wins').innerText = d.wins;
        document.getElementById('losses').innerText = d.losses;
    });

    // VERİ GÖNDERME (Butonlar)
    function send(field, val) {
        db.ref(REF_PATH + '/' + field).transaction(c => (c || 0) + val);
    }

    function reset() {
        if(confirm('Sıfırlansın mı?')) db.ref(REF_PATH).set({ wins: 0, losses: 0 });
    }

    // GİRİŞ MODU KONTROLÜ
    if (window.location.search.includes('mode=admin')) {
        document.getElementById('adminUI').style.display = 'flex';
        document.getElementById('overlayUI').style.display = 'none';
        document.body.style.background = "#0a0a0a";
    }
</script>
</body>
</html>
