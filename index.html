<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>FC26 - Elite Control Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root {
            --gold: #d4af37;
            --gold-glow: rgba(212, 175, 55, 0.6);
            --red: #e74c3c;
            --green: #2ecc71;
            --bg-dark: #0a0a0c;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: transparent; font-family: 'Anton', sans-serif; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }

        /* --- TABELA GÖRÜNÜMÜ --- */
        .container {
            position: relative;
            width: 900px;
            height: 400px;
            background: url('bp.png') no-repeat center center;
            background-size: contain;
            filter: drop-shadow(0 0 10px rgba(0,0,0,0.5));
        }

        .score { 
            position: absolute;
            top: 49%;
            transform: translateY(-50%);
            font-size: 115px; 
            color: #ffffff;
            font-family: 'Orbitron', sans-serif; /* Daha teknolojik bir font */
            text-shadow: 0 0 15px var(--gold-glow), 4px 4px 5px rgba(0,0,0,0.9);
            width: 180px;
            text-align: center;
            letter-spacing: -2px;
        }

        #wins { left: 108px; }
        #losses { right: 108px; }

        /* --- MODERN ADMİN PANELİ --- */
        #adminUI { 
            display: none; flex-direction: column; align-items: center; justify-content: center; 
            height: 100vh; width: 100vw; background: var(--bg-dark); gap: 25px; 
            position: fixed; top: 0; left: 0; z-index: 999;
            background: radial-gradient(circle, #1a1a1f 0%, #050505 100%);
        }

        .panel-header {
            color: var(--gold);
            font-family: 'Orbitron', sans-serif;
            font-size: 32px;
            letter-spacing: 4px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px var(--gold-glow);
        }

        .btn-group { display: flex; flex-direction: column; gap: 15px; }

        .btn { 
            width: 340px; padding: 22px; font-size: 26px; cursor: pointer; border-radius: 8px; 
            border: 1px solid rgba(255,255,255,0.1); color: white; font-family: 'Orbitron', sans-serif; 
            transition: all 0.2s ease; text-transform: uppercase;
            position: relative; overflow: hidden;
        }

        .btn-w { background: linear-gradient(145deg, #1d3521, #27ae60); box-shadow: 0 0 15px rgba(46, 204, 113, 0.2); }
        .btn-l { background: linear-gradient(145deg, #441a1a, #c0392b); box-shadow: 0 0 15px rgba(192, 57, 43, 0.2); }

        .btn:hover { transform: scale(1.02); filter: brightness(1.2); }
        .btn:active { transform: scale(0.98); }

        .reset-link {
            color: #444; text-decoration: none; font-size: 14px; margin-top: 20px;
            cursor: pointer; transition: 0.3s;
        }
        .reset-link:hover { color: var(--red); }
    </style>
</head>
<body>

<div id="overlayUI">
    <div class="container">
        <span class="score" id="wins">0</span>
        <span class="score" id="losses">0</span>
    </div>
</div>

<div id="adminUI">
    <div class="panel-header">FC26 CONTROL CENTER</div>
    <div class="btn-group">
        <button class="btn btn-w" onclick="update('wins', 1)">VICTORY +1</button>
        <button class="btn btn-l" onclick="update('losses', 1)">DEFEAT +1</button>
    </div>
    <div class="reset-link" onclick="res()">System Reset (Score 0-0)</div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://adem-can-yirtici-default-rtdb.europe-west1.firebasedatabase.app" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const scoreRef = db.ref('skorlar');

    scoreRef.on('value', (snapshot) => {
        const data = snapshot.val() || { wins: 0, losses: 0 };
        document.getElementById('wins').innerText = data.wins || 0;
        document.getElementById('losses').innerText = data.losses || 0;
    });

    function update(type, val) {
        scoreRef.child(type).transaction((current) => (current || 0) + val);
    }

    function res() {
        if(confirm('Tüm skorlar sıfırlanacak. Onaylıyor musun?')) scoreRef.set({ wins: 0, losses: 0 });
    }

    if (window.location.search.includes('mode=admin')) {
        document.getElementById('adminUI').style.display = 'flex';
        document.getElementById('overlayUI').style.display = 'none';
    }
</script>
</body>
</html>
