<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FC26 Admin Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; font-family: 'Oswald', sans-serif; color: white; }

  /* SCOREBOARD GÖRÜNÜMÜ (Normal modda çalışır) */
  #overlayUI { display: flex; align-items: center; justify-content: center; height: 100vh; }
  .board { display: flex; height: 70px; filter: drop-shadow(0 6px 20px #000); }
  .panel-left { background: linear-gradient(180deg, #1e7020 0%, #155016 100%); width: 110px; clip-path: polygon(0 0, 100% 0, 90% 100%, 0 100%); display: flex; align-items: center; justify-content: center; border-radius: 10px 0 0 10px; }
  .panel-right { background: linear-gradient(180deg, #2b4e10 0%, #1e3a0a 100%); width: 110px; clip-path: polygon(10% 0, 100% 0, 100% 100%, 0 100%); display: flex; align-items: center; justify-content: center; border-radius: 0 10px 10px 0; }
  .score { font-size: 50px; font-weight: 900; }
  .badge { width: 80px; height: 80px; border-radius: 50%; background: radial-gradient(circle, #ffe566, #9a7010); border: 4px solid #b08820; display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0 -5px; z-index: 10; }

  /* ADMIN PANELİ (Kumanda modu - Tıklanabilir alanları büyüttük) */
  #adminUI { 
    display: none; 
    flex-direction: column; 
    align-items: center; 
    justify-content: center; 
    gap: 20px; 
    height: 100vh; 
    width: 100%;
    padding: 20px;
    position: relative;
    z-index: 9999; /* En üstte olmasını sağlar */
  }

  .admin-btn { 
    width: 100%; 
    max-width: 400px; 
    padding: 30px; 
    font-size: 28px; 
    font-weight: 900; 
    border: none; 
    border-radius: 15px; 
    cursor: pointer; 
    text-transform: uppercase;
    box-shadow: 0 5px 15px rgba(0,0,0,0.5);
    display: block; /* Tıklanabilirliği garanti eder */
  }

  .btn-w { background: #1e7020; color: white; }
  .btn-l { background: #7a1a1a; color: white; }
  .btn-reset { background: #444; color: #ccc; padding: 15px; font-size: 16px; }
  
  .btn-w:active, .btn-l:active { transform: scale(0.95); }
</style>
</head>
<body>

<div id="overlayUI">
  <div class="board">
    <div class="panel-left"><span class="score" id="wScore">0</span></div>
    <div class="badge"><span style="font-size:12px; color:#3a2000; font-weight:900;">FC26</span></div>
    <div class="panel-right"><span class="score" id="lScore">0</span></div>
  </div>
</div>

<div id="adminUI">
    <h2 style="margin-bottom:10px;">FC26 KUMANDA PANELİ</h2>
    <button class="admin-btn btn-w" onclick="sendUpdate('wins', 1)">GALİBİYET +1</button>
    <button class="admin-btn btn-w" style="opacity:0.6; padding:10px; font-size:16px;" onclick="sendUpdate('wins', -1)">WINS -1 (Hata Düzelt)</button>
    <button class="admin-btn btn-l" onclick="sendUpdate('losses', 1)">MAĞLUBİYET +1</button>
    <button class="admin-btn btn-l" style="opacity:0.6; padding:10px; font-size:16px;" onclick="sendUpdate('losses', -1)">LOSSES -1 (Hata Düzelt)</button>
    <button class="admin-btn btn-reset" onclick="resetAll()">SKORLARI SIFIRLA</button>
</div>

<script>
  // FIREBASE BAĞLANTISI (Linkini buraya yapıştır)
  const firebaseConfig = { databaseURL: "https://adem-can-yirtici-default-rtdb.europe-west1.firebasedatabase.app/" };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // URL Kontrolü
  const mode = new URLSearchParams(window.location.search).get('mode');
  if (mode === 'admin') {
      document.getElementById('adminUI').style.display = 'flex';
      document.getElementById('overlayUI').style.display = 'none';
  }

  // Veri Dinleme
  db.ref('fc26_data').on('value', (snap) => {
    const data = snap.val() || { wins: 0, losses: 0 };
    document.getElementById('wScore').innerText = data.wins;
    document.getElementById('lScore').innerText = data.losses;
  });

  // Veri Gönderme
  function sendUpdate(field, val) {
    db.ref('fc26_data/' + field).transaction((current) => {
      return Math.max(0, (current || 0) + val);
    });
  }

  function resetAll() {
    if(confirm('Skorlar sıfırlansın mı?')) {
        db.ref('fc26_data').set({ wins: 0, losses: 0 });
    }
  }
</script>
</body>
</html>
