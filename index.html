<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>FC26 Live Scoreboard</title>
    <style>
        body, html { margin: 0; padding: 0; background-color: transparent; overflow: hidden; font-family: 'Arial Black', sans-serif; }

        .container { 
            position: relative; 
            width: 1000px; 
            height: 400px; 
            margin: 0 auto; 
        }

        .bg-img { width: 100%; display: block; }

        /* SIFIRLAMA ALANI (ORTA KALKAN) */
        #reset-zone {
            position: absolute;
            top: 50px;
            left: 400px;
            width: 200px;
            height: 200px;
            cursor: pointer;
            z-index: 10;
        }

        /* RAKAM STİLLERİ VE TIKLAMA ALANLARI */
        .score-num {
            position: absolute;
            width: 155px;         
            height: 148px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 135px;      
            color: #FFD700;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
            font-weight: 900;
            cursor: pointer; /* Tıklanabilir olduğunu belli eder */
            z-index: 20;
            user-select: none;
        }

        #home-score { top: 130px; left: 127px; }
        #away-score { top: 130px; right: 108px; }

        /* Admin modunda değilken tıklamaları kapatmak istersen bu kısım kalabilir */
        body:not(.admin-mode) .score-num, 
        body:not(.admin-mode) #reset-zone { pointer-events: none; }
    </style>
</head>
<body id="main-body">

    <div class="container">
        <img src="skortb.png" class="bg-img">
        
        <div id="reset-zone" onclick="resetScores()"></div>

        <div id="home-score" class="score-num" 
             onclick="updateScore('evSkor', 1)" 
             oncontextmenu="updateScore('evSkor', -1); return false;">0</div>
             
        <div id="away-score" class="score-num" 
             onclick="updateScore('depSkor', 1)" 
             oncontextmenu="updateScore('depSkor', -1); return false;">0</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://adem-can-yirtici-default-rtdb.europe-west1.firebasedatabase.app" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const scoreRef = ref(db, 'skorlar');

        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('mode') === 'admin') { document.getElementById('main-body').classList.add('admin-mode'); }

        onValue(scoreRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                document.getElementById('home-score').innerText = data.evSkor || 0;
                document.getElementById('away-score').innerText = data.depSkor || 0;
            }
        });

        window.updateScore = (type, amount) => {
            const r = ref(db, `skorlar/${type}`);
            onValue(r, (s) => { 
                let current = s.val() || 0;
                let next = current + amount;
                if(next < 0) next = 0; // Skor 0'ın altına düşmesin
                set(r, next); 
            }, { onlyOnce: true });
        };

        window.resetScores = () => {
            set(scoreRef, { evSahibi: "WIN", deplasman: "LOSE", evSkor: 0, depSkor: 0 });
        };
    </script>
</body>
</html>
