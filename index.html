<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FC26 UT Champs Scoreboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: transparent; font-family: 'Bebas Neue', cursive; overflow: hidden; color: white; }

        #overlayUI { display: flex; align-items: center; justify-content: center; height: 100vh; }

        /* ANA TABELA GÖVDESİ */
        .board { 
            display: flex; 
            height: 70px; 
            align-items: center;
            background: linear-gradient(180deg, #a51a1a 0%, #630f0f 100%); /* Kırmızı Degrade */
            border: 3px solid #d4af37; /* Altın Rengi Kenarlık */
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            position: relative;
            padding: 0 15px;
        }

        .panel { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            width: 80px;
            height: 100%;
        }

        /* SKOR SAYILARI */
        .score { 
            font-size: 65px; 
            line-height: 1;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.8);
        }

        /* ORTADAKİ BEYAZ KALKAN (LOGO) */
        .badge-container {
            width: 95px;
            height: 110px; /* Panellerden dışarı taşar */
            background: #ffffff; /* Birebir beyaz arka plan */
            border: 3px solid #d4af37;
            margin: 0 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            /* Kalkan Şekli */
            clip-path: polygon(0 0, 100% 0, 100% 80%, 50% 100%, 0 80%);
            margin-top: -10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .ut-text { 
            color: #a51a1a; /* Kalkan içindeki yazı kırmızı */
            font-size: 45px; 
            font-weight: 900; 
            line-height: 0.8; 
            margin-top: -5px;
        }
        
        .champs-text { 
            color: #d4af37; 
            font-size: 11px; 
            letter-spacing: 1.5px; 
            font-weight: bold; 
            border-top: 1px solid #ddd;
            padding-top: 2px;
        }

        /* ADMIN PANELİ (KUMANDA) */
        #adminUI { display: none; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #0a0a0a; gap: 20px; padding: 20px; }
        .btn { width: 100%; max-width: 400px; padding: 20px; font-size: 28px; font-family: 'Bebas Neue'; border: none; border-radius: 10px; cursor: pointer; color: white; transition: 0.1s; }
        .btn-w { background: #1e7020; border-bottom: 6px solid #134614; }
        .btn-l { background: #7a1a1a; border-bottom: 6px solid #4e1111; }
        .btn-s { background: #333; font-size: 16px; margin-top: 20px; color: #999; }
        .btn:active { transform: translateY(3px); border-bottom: none; }
    </style>
</head>
<body>

<div id="overlayUI">
    <div class="board">
        <div class="panel">
            <span class="score" id="wScore">0</span>
        </div>

        <div class="badge-container">
            <span class="ut-text">UT</span>
            <span class="champs-text">CHAMPIONS</span>
        </div>

        <div class="panel">
            <span class="score" id="lScore">0</span>
        </div>
    </div>
</div>

<div id="adminUI">
    <h1 style="color:#d4af37; letter-spacing:3px; margin-bottom:10px;">FC26 YAYIN KUMANDASI</h1>
    <button class="btn btn-w" onclick="update('wins', 1)">GALİBİYET (WINS) +1</button>
    <button class="btn btn-l" onclick="update('losses', 1)">MAĞLUBİYET (LOSS) +1</button>
    <button class="btn btn-s" onclick="reset()">SKORLARI SIFIRLA</button>
</div>

<script>
    // FİRBASE AYARLARI
    const firebaseConfig = { databaseURL: "https://adem-can-yirtici-default-rtdb.europe-west1.firebasedatabase.app/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const DB_PATH = 'fc26_data'; 

    // MOD KONTROLÜ
    const mode = new URLSearchParams(window.location.search).get('mode');
    if (mode === 'admin') {
        document.getElementById('adminUI').style.display = 'flex';
        document.getElementById('overlayUI').style.display = 'none';
        document.body.style.background = "#0a0a0a";
        document.body.style.overflow = "auto";
    }

    // VERİ DİNLEME (TABELAYI GÜNCELLE)
    db.ref(DB_PATH).on('value', (s) => {
        const d = s.val() || { wins: 0, losses: 0 };
        document.getElementById('wScore').innerText = d.wins;
        document.getElementById('lScore').innerText = d.losses;
    });

    // VERİ YAZMA (BUTONLAR)
    function update(f, v) {
        db.ref(DB_PATH + '/' + f).transaction(c => Math.max(0, (c || 0) + v));
    }

    function reset() {
        if(confirm('Tüm skorlar sıfırlansın mı?')) db.ref(DB_PATH).set({ wins: 0, losses: 0 });
    }
</script>
</body>
</html>
