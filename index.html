<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; background-color: transparent; overflow: hidden; font-family: sans-serif; }
        .container { position: relative; width: 1000px; height: 400px; margin: auto; }
        
        /* Arka plan görseli - GitHub Pages üzerinde tam yol vermek daha iyidir */
        .bg { width: 100%; }

        .text { position: absolute; color: white; font-weight: bold; text-shadow: 2px 2px 5px #000; }
        
        /* Konumları görseline göre buradan ayarla */
        #home-name { top: 65px; left: 130px; font-size: 28px; width: 180px; text-align: center; }
        #away-name { top: 65px; right: 130px; font-size: 28px; width: 180px; text-align: center; }
        #score { top: 125px; left: 50%; transform: translateX(-50%); font-size: 60px; color: #ffcc00; }
    </style>
</head>
<body>

    <div class="container">
        <img src="skortb.png" class="bg">
        
        <div id="home-name" class="text">YÜKLENİYOR...</div>
        <div id="score" class="text">0 - 0</div>
        <div id="away-name" class="text">YÜKLENİYOR...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://adem-can-yirtici-default-rtdb.europe-west1.firebasedatabase.app"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Firebase'deki 'skorlar' düğümünü dinle
        const scoreRef = ref(db, 'skorlar'); 
        onValue(scoreRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                // EĞER FIREBASE'DEKİ İSİMLER FARKLIYSA BURAYI DÜZELT:
                // Örneğin Firebase'de "ev_sahibi" yazıyorsa data.ev_sahibi yapmalısın.
                document.getElementById('home-name').innerText = data.evSahibi || "EV";
                document.getElementById('away-name').innerText = data.deplasman || "DEP";
                document.getElementById('score').innerText = (data.evSkor ?? 0) + " - " + (data.depSkor ?? 0);
            }
        });
    </script>
</body>
</html>
