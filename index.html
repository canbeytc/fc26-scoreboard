<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FC26 Scoreboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: transparent; font-family: 'Oswald', sans-serif; overflow: hidden; }
        #overlayUI { display: flex; align-items: center; justify-content: center; height: 100vh; }
        .board { display: flex; height: 65px; filter: drop-shadow(0 8px 25px rgba(0,0,0,0.8)); }
        .panel { width: 110px; display: flex; align-items: center; justify-content: center; color: white; }
        .p-left { background: linear-gradient(180deg, #1e7020 0%, #155016 100%); clip-path: polygon(0 0, 100% 0, 90% 100%, 0 100%); border-radius: 10px 0 0 10px; }
        .p-right { background: linear-gradient(180deg, #2b4e10 0%, #1e3a0a 100%); clip-path: polygon(10% 0, 100% 0, 100% 100%, 0 100%); border-radius: 0 10px 10px 0; }
        .score { font-size: 45px; font-weight: 900; }
        .badge { width: 75px; height: 75px; border-radius: 50%; background: radial-gradient(circle, #ffe566, #9a7010); border: 4px solid #b08820; z-index: 10; margin: 0 -5px; display: flex; align-items: center; justify-content: center; color: #3a2000; font-weight: 900; font-size: 14px; }
        
        #adminUI { display: none; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #111; color: white; gap: 15px; padding: 20px; }
        .btn { width: 100%; max-width: 350px; padding: 20px; font-size: 22px; font-weight: bold; border: none; border-radius: 12px; cursor: pointer; color: white; text-transform: uppercase; }
        .btn-w { background: #1e7020; }
        .btn-l { background: #7a1a1a; }
        .btn-s { background: #555; font-size: 14px; }
    </style>
</head>
<body>

<div id="overlayUI">
    <div class="board">
        <div class="panel p-left"><span class="score" id="wScore">0</span></div>
        <div class="badge">FC26</div>
        <div class="panel p-right"><span class="score" id="lScore">0</span></div>
    </div>
</div>

<div id="adminUI">
    <h2 id="statusText">FC26 KUMANDA</h2>
    <button class="btn btn-w" onclick="update('wins', 1)">GALİBİYET +1</button>
    <button class="btn btn-w" style="opacity:0.5; font-size:14px; padding:10px;" onclick="update('wins', -1)">WINS -1</button>
    <button class="btn btn-l" onclick="update('losses', 1)">MAĞLUBİYET +1</button>
    <button class="btn btn-l" style="opacity:0.5; font-size:14px; padding:10px;" onclick="update('losses', -1)">LOSSES -1</button>
    <button class="btn btn-s" onclick="reset()">HER ŞEYİ SIFIRLA</button>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://adem-can-yirtici-default-rtdb.europe-west1.firebasedatabase.app/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Senin ekran görüntünde çalışan klasör buydu
    const DB_PATH = 'fc26_data'; 

    const mode = new URLSearchParams(window.location.search).get('mode');
    if (mode === 'admin') {
        document.getElementById('adminUI').style.display = 'flex';
        document.getElementById('overlayUI').style.display = 'none';
        document.body.style.background = "#111";
        document.body.style.overflow = "auto";
    }

    // VERİ DİNLEME
    db.ref(DB_PATH).on('value', (s) => {
        const d = s.val() || { wins: 0, losses: 0 };
        document.getElementById('wScore').innerText = d.wins;
        document.getElementById('lScore').innerText = d.losses;
    });

    // VERİ GÜNCELLEME
    function update(f, v) {
        db.ref(DB_PATH + '/' + f).transaction(c => {
            const newValue = Math.max(0, (c || 0) + v);
            console.log("Güncelleniyor:", f, newValue);
            return newValue;
        });
    }

    function reset() {
        if(confirm('Tüm skorlar sıfırlansın mı?')) {
            // Hem ana klasörü hem de varsa diğerlerini temizle
            db.ref(DB_PATH).set({ wins: 0, losses: 0 });
            db.ref('live_scores').set({ wins: 0, losses: 0 });
        }
    }
</script>
</body>
</html>
